modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "${mod_logo_path}"
    credits = "${credits}"
    authors = "${mod_author}"
    description = '''${description}'''

[[dependencies."${mod_id}"]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "aaa_particles"
    mandatory = true
    versionRange = "${aaa_particles_version_range}"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies."${mod_id}"]]
    modId = "cloth_config"
    mandatory = true
    versionRange = "${cloth_config_version_range}"
    ordering = "NONE"
    side = "CLIENT"
