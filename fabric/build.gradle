plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    modImplementation "cn.chloeprime:aaa_particles-fabric-1.21.1:${aaa_particles_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modImplementation "dev.architectury:architectury-fabric:${architectury_version}"
    modImplementation "maven.modrinth:forge-config-api-port:${forgeconfigapiport_version}"

    // ForgeConfigAPIPort carries night-config as nested jars, which Loom does not unwrap in a dev run.
    // Without these, AAAParticles' AAAClientConfig fails with NoClassDefFoundError for
    // com.electronwill.nightconfig.core.ConfigFormat and the client crashes on startup.
    implementation "com.electronwill.night-config:core:${nightconfig_version}"
    implementation "com.electronwill.night-config:toml:${nightconfig_version}"

    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("../run/fabric-client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("../run/fabric-server")
        }
    }
}
