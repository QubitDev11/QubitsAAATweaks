plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()

    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

    maven {
        name = 'Chloe Maven'
        url = 'https://maven.chloeprime.cn:4080/releases/'
        content {
            includeGroup('cn.chloeprime')
            includeGroup('mod.chloeprime')
        }
    }

    maven {
        name = 'Shedaniel Maven'
        url = 'https://maven.shedaniel.me/'
    }

    maven {
        name = 'Architectury Maven'
        url = 'https://maven.architectury.dev/'
    }

    maven {
        name = 'TerraformersMC Maven'
        url = 'https://maven.terraformersmc.com/releases/'
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
    }

    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                    : version,
            'group'                      : project.group, //Else we target the task's group.
            'minecraft_version'          : minecraft_version,
            'minecraft_version_range'    : minecraft_version_range,
            'fabric_version'             : fabric_version,
            'fabric_loader_version'      : fabric_loader_version,
            'mod_name'                   : mod_name,
            'mod_author'                 : mod_author,
            'mod_id'                     : mod_id,
            'license'                    : license,
            'description'                : project.description,
            'neoforge_version'            : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                    : credits,
            'java_version'               : java_version,
            'mod_version'                : mod_version,
            'mod_logo_path'              : mod_logo_path,
            'pack_format'                : pack_format,
            'aaa_particles_version'      : aaa_particles_version,
            'aaa_particles_version_range': aaa_particles_version_range,
            'cloth_config_version'       : cloth_config_version,
            'cloth_config_version_range' : cloth_config_version_range,
            'mixin_version'              : mixin_version,
            'mixinextras_version'        : mixinextras_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(JavaLanguageVersion.of(java_version).asInt())
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint', 'none')
    failOnError = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
