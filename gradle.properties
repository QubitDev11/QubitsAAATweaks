# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.20.1-1.0.0
group=org.qubitdev
java_version=17

# Common
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
mod_name=Qubit's AAA Tweaks
mod_author=AquTheSeal
mod_id=qubitsaaatweaks
license=MIT
credits=AquTheSeal
description=Rendering optimizations and post-processing bloom enhancements for AAAParticles.
mod_logo_path=qubitsaaatweaks.png
mod_version=1.20.1-1.0.0b2
pack_format=15
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Mixins
mixin_version=0.8.5-SNAPSHOT
mixinextras_version=0.5.4

# Dependencies (Mandatory)
aaa_particles_version=2.3.4
aaa_particles_version_range=[2.3.4,)
cloth_config_version=11.1.136
cloth_config_version_range=[11.0.0,)
modmenu_version=7.2.2

# AAA Particles bundles Architectury and ForgeConfigAPIPort in its own jar, but Fabric Loader does not
# unwrap those nested jars for dependency mods in a dev environment, so they are declared explicitly.
architectury_version=9.2.14
forgeconfigapiport_version=v8.0.0-1.20.1-Fabric

# Fabric
fabric_version=0.92.2+1.20.1
fabric_loader_version=0.16.14

# Forge
forge_version=47.4.20
forge_version_range=[47,)
forge_loader_version_range=[47,)
# Optional on Forge - AAAParticles probes for Iris at runtime, but the dev client should ship them like before.
embeddium_file_id=5681725
oculus_file_id=6020952

# Gradle
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false
# Fabric Loom 1.15.x needs a Java 21+ Gradle daemon. The mod itself still targets Java 17
# (java_version above), so this only affects the build tooling, not the produced jars.
org.gradle.java.home=C:/Users/SDY/.jdks/jbrsdk_jcef-21.0.11
